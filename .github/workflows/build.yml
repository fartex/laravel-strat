name: Build

on:
  pull_request:
    branches: ["main", "develop"]
    types: ["opened", "reopened", "synchronize", "ready_for_review"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Dashboard Assets
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Front-End Dependencies
        run: |
          npm ci

      - name: Build Front-End Assets
        run: |
          npm run build

      # The compiled dashboard ships inside the package, so the committed bundle
      # must match the sources.
      - name: Check Committed Bundle Is Up To Date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
